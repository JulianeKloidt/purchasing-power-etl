[project]
name = "purchasing-power-etl"
version = "0.1.0"
description = "ETL pipeline for World Bank CPI and PPP-based purchasing power normalization"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict = false

